name: ci

# Builds mod-host with the carried patches, checks `make install-lib` from
# pkg-config alone, runs the tests that need no plugins
# (the socket protocol against a fake backend, the AddressSanitizer tests of the
# line splitter and the socket framing) and a smoke test of the real host on a
# dummy JACK server. The rpm job builds the RPMs of packaging/mod-host.spec from this
# tree, at the version debian/changelog names, and installs them. The fuzz job builds the libFuzzer harnesses of fuzz/ and runs each for
# a short time over its seed corpus.

on:
  push:
    branches: [freemixer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 \
            liblilv-dev libjack-jackd2-dev jackd2 libreadline-dev lv2-dev libfftw3-dev
      - name: Build
        run: make -j"$(nproc)" && make lib
      - name: The version is what the packaging passes, else what git describes
        run: |
          ./mod-host -V | grep -F "version: $(git describe --tags)"
          make clean >/dev/null && make -j"$(nproc)" VERSION=9.9.9-test >/dev/null
          ./mod-host -V | grep -F 'version: 9.9.9-test'
          make clean >/dev/null && make -j"$(nproc)" >/dev/null && make lib >/dev/null
      - name: Install the protocol library
        run: timeout 300 make test-install-lib
      - name: Protocol tests
        run: timeout 300 make test-protocol test-protocol-commands
      - name: Splitter and framing tests
        run: timeout 300 make -C tests utils-run socket-run bind-run
      - name: Smoke test
        run: timeout 120 sh .github/scripts/smoke-test.sh

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          sudo apt-get install -y --no-install-recommends "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev" || true
      - name: Build the harnesses
        run: make fuzz
      - name: Run each harness over its seed corpus
        run: make fuzz-run FUZZ_TIME=60
      - name: Keep what a failing run found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts/
          if-no-files-found: ignore

  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install gcc make git python3 pkgconf-pkg-config libasan \
            lilv-devel jack-audio-connection-kit jack-audio-connection-kit-devel \
            readline-devel lv2-devel fftw-devel
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -j"$(nproc)" && make lib
      - name: Install the protocol library
        run: timeout 300 make test-install-lib
      - name: Protocol tests
        run: timeout 300 make test-protocol test-protocol-commands
      - name: Splitter and framing tests
        run: timeout 300 make -C tests utils-run socket-run bind-run
      - name: Smoke test
        run: timeout 120 sh .github/scripts/smoke-test.sh

  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins gcc make tar gzip python3 \
            pipewire-jack-audio-connection-kit-devel dpkg-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: One version for the DEBs and the RPMs
        run: |
          deb=$(dpkg-parsechangelog -S Version)
          rpm=$(sed -n 's/^Version: *//p' packaging/mod-host.spec)
          [ "${deb%-*}" = "$rpm" ] || { echo "::error::debian/changelog says $deb, packaging/mod-host.spec says $rpm"; exit 1; }
      - uses: FreeMixer/.github/.github/actions/build-rpm@v1
      - name: Install the packages
        run: |
          dnf install -y --setopt=install_weak_deps=False rpms/mod-host-[0-9]*.x86_64.rpm \
            rpms/mod-host-protocol-[0-9]*.x86_64.rpm rpms/mod-host-protocol-devel-[0-9]*.x86_64.rpm
          version=$(sed -n 's/^Version: *//p' packaging/mod-host.spec)
          rpm -q --provides mod-host-protocol | grep -q "^mod-host-protocol = $version-" \
            || { echo "::error::mod-host-protocol does not provide its version $version"; exit 1; }
          rpm -q --provides mod-host-protocol | grep -q '^libmod-host-protocol\.so\.0'
          rpm -q --provides mod-host-protocol-devel | grep -q '^pkgconfig(mod-host-protocol)'
          pkg-config --modversion mod-host-protocol
          /usr/bin/mod-host -V | grep -F "version: $version" \
            || { echo "::error::mod-host -V does not print version: $version"; /usr/bin/mod-host -V; exit 1; }
